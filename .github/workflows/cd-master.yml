name: CD
on:
  push:
    branches: [master]

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on Render Docker Image
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Extract GitHub Container Registry, repository (lowercase) & version from pom
        run: |
          echo "GHCR_URL=ghcr.io" >> $GITHUB_ENV
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal:
      #    GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic)
      #    Permisos mínimos: write:packages, read:packages, delete:packages, repo
      # 2º Crear secret en GitHub:
      #    Repo → Settings → Secrets and variables → Actions → New repository secret
      #    Name: GHCR_PERSONAL_ACCESS_TOKEN, Value: <tu token>
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest

      # 🌐 AWS Deployment
      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3
        with:
            host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
            username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
            key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
            script: |
              APP_NAME=devops-app
              POSTGRES_DB="${{ secrets.POSTGRES_DB }}"

              echo ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

              sudo docker pull ghcr.io/${{ env.REPOSITORY }}:latest
              sudo docker network create devops || true
              sudo docker rm -f $APP_NAME || true
              sudo docker run -d \
                --name $APP_NAME \
                --restart always \
                --memory 512m \
                --memory-swap 1024m \
                --network devops \
                -p 10000:10000 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e POSTGRES_URL="jdbc:postgresql://postgres-db:5432/$POSTGRES_DB" \
                -e POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
                -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
                ghcr.io/${{ env.REPOSITORY }}:latest

              echo "⏳ Esperando a que se levante"
              for i in $(seq 1 6); do
                sleep 15
                STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' $APP_NAME 2>/dev/null)
                echo "Intento $i: $STATUS"
                [ "$STATUS" = "healthy" ] && break
              done

              if [ "$STATUS" != "healthy" ]; then
                echo "❌ Deploy fallido"
                sudo docker logs --tail 50 $APP_NAME
                exit 1
              fi

              echo "✅ Deploy exitoso"
              sudo docker image prune --filter "until=12h" -f
            

      #  run: |
      #    curl --fail -X POST "https://api.render.com/deploy/${{ secrets.RENDER_DEPLOY_HOOK_TOKEN }}" \
      #    && echo "✅ Deployment succeeded" \
      #    || (echo "❌ Deployment failed" && exit 1)
